<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>What's For Dinner</title>
    <meta name="description" content="The Most Important Website Talking About Today's Dinner.">
    <link rel="shortcut icon" href="./images/favicon.png" type="image/x-icon">
    <link rel="stylesheet" href="./css/all.min.css">
    <link rel="stylesheet" href="./css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/style.css">
</head>

<body style="background-color: #FFFBEB;">
    <!-- Start Navbar -->
    <nav class="navbar navbar-expand-lg bg-white px-4 py-3 shadow-sm">
        <div class="container-xxl">
            <div class="d-flex me-auto mb-2 mb-lg-0 align-items-center">
                <a class="navbar-brand rounded-circle shadow-lg" href="#">
                    <i class="fa-solid fa-utensils fa-md" style="color: white;"></i>
                </a>
                <div class="title">
                    <h1 class="mb-0">What's For Dinner</h1>
                    <p class="mb-0">Your daily meal inspiration</p>
                </div>
            </div>
            <button class="justify-content-end navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
                aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="justify-content-end collapse navbar-collapse" id="navbarSupportedContent">
                <div class="d-flex flex-column align-items-lg-center flex-md-column flex-lg-row align-items-start">
                    <button class="nav-link me-3" aria-current="page" href="#">
                        <i class="fa-solid fa-bookmark fa-lg"></i>
                        <span class="d-lg-none ms-2">Saved Recipes</span>
                    </button>
                    <button class="nav-link me-3" href="#">
                        <i class="fa-solid fa-clock-rotate-left fa-lg"></i>
                        <span class="d-lg-none ms-2">Recent</span>
                    </button>
                    <button class="nav-link me-3" href="#">
                        <i class="fa-solid fa-gear fa-lg"></i>
                        <span class="d-lg-none ms-2">Settings</span>
                    </button>
                    <button class="nav-link me-3" href="#">
                        <div style="width: 40px; background-color: #FFB869;" class="d-inline-block rounded-circle">
                            <img src="./images/avatar.jpg" alt="Profile" class="rounded-circle w-100"
                                style="padding: 2px;">
                        </div>
                        <span class="d-lg-none ms-2">Profile</span>
                    </button>
                </div>
            </div>
        </div>
    </nav>
    <!-- End Navbar -->
    <!-- Main Card -->
    <main id="main-content" class="px-4">
        <div class="container-xxl">
            <div class="card mb-3 rounded-5 shadow-lg overflow-hidden"">
                <div class="row g-0">
                    <div id="imgSection" class="col-sm col-md-5 position-relative">
                        <!-- Image Holder -->
                    </div>
                    <div class="col-md-7 col-sm h-100">
                        <div class="card-body overflow-y-auto">
                            <section id="infoSection">
                                <!-- INFO SECTION HOLDER -->
                            </section>
                            <section id="nav-tabs">
                                <ul class="border-bottom border-1 pb-3 mb-4 nav nav-pills mb-3 d-flex justify-content-between"
                                    id="pills-tab" role="tablist">
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link active" id="ingredients-tab" data-bs-toggle="pill"
                                            data-bs-target="#ingredients" type="button" role="tab"
                                            aria-controls="ingredients" aria-selected="true">
                                            <i class="fa-solid fa-list-check"></i>
                                            <span class="text-sm-truncate">Ingredients</span>
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="instructions-tab" data-bs-toggle="pill"
                                            data-bs-target="#instructions" type="button" role="tab"
                                            aria-controls="instructions" aria-selected="false">
                                            <i class="fa-solid fa-book-open"></i>
                                            <span class="text-sm-truncate">Instructions</span>
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="nutrition-tab" data-bs-toggle="pill"
                                            data-bs-target="#nutrition" type="button" role="tab"
                                            aria-controls="nutrition" aria-selected="false">
                                            <i class="fa-solid fa-chart-pie"></i>
                                            <span class="text-sm-truncate">Nutrition</span>
                                        </button>
                                    </li>
                                    <li class="nav-item" role="presentation">
                                        <button class="nav-link" id="tips-tab" data-bs-toggle="pill"
                                            data-bs-target="#tips" type="button" role="tab" aria-controls="tips"
                                            aria-selected="false">
                                            <i class="fa-solid fa-lightbulb"></i>
                                            <span class="text-sm-truncate">Chef's Tips</span>
                                        </button>
                                    </li>
                                </ul>
                                <div class="tab-content" id="pills-tabContent">
                                    <div class="tab-pane fade show active" id="ingredients" role="tabpanel"
                                        aria-labelledby="ingredients-tab" tabindex="0">
                                        <ul id="ingredientsList" class="p-4 rounded-4 overflow-auto"
                                            style="background-color: #FFFAEC;">
                                            <!-- INGREDIENTS LIST -->
                                        </ul>
                                    </div>
                                    <div class="tab-pane fade" id="instructions" role="tabpanel"
                                        aria-labelledby="instructions-tab" tabindex="0">
                                        <ul id="instructionsList" class="overflow-auto">
                                            <!-- INSTRUCTIONS LIST -->
                                        </ul>
                                    </div>
                                    <div class="tab-pane fade" id="nutrition" role="tabpanel"
                                        aria-labelledby="nutrition-tab" tabindex="0">
                                        <div id="nutritionGrid" class="row g-3">
                                            <!-- NUTRITION GRID -->
                                        </div>
                                    </div>
                                    <div class="tab-pane fade" id="tips" role="tabpanel" aria-labelledby="tips-tab"
                                        tabindex="0">
                                        <div id="tipsList">
                                            <!-- TIPS LIST -->
                                        </div>
                                    </div>
                                </div>
                            </section>
                            <button onclick="getRandomRecipe()" class="shadow-lg  d-block m-auto button text-white px-4 py-3 rounded-5 border-0 fw-bold">
                                <i class="fa-solid fa-rotate" style="color: rgb(255, 255, 255);"></i>
                                Try Another Recipe
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <!-- End Main Card -->

    <script src="./js/bootstrap.bundle.min.js"></script>
    <script src="./js/main.js"></script>
</body>

</html>
